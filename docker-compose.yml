version: '3.7'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-node
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    ports:
      - "8080:8080"
    entrypoint: /app/console
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      - redpanda

  # --- YOUR AI PIPELINE SERVICES ---
  producer:
    build: .
    command: python src/producer.py
    env_file: .env
    depends_on:
      - redpanda

  processor:
    build: .
    command: python src/processor.py
    env_file: .env
    depends_on:
      - redpanda

  feature-engineer:
    build: .
    command: python src/feature_engineer.py
    env_file: .env
    volumes:
      - ./data:/app/data   # Prevents data loss if the container stops
    depends_on:
      - redpanda

  metric-server:
    build: .
    command: python src/metric_server.py
    env_file: .env
    ports:
      - "8000:8000"        # Exposes metrics to local machine and Kubernetes
    volumes:
      - ./data:/app/data   # Reads the CSV created by feature-engineer

# The volumes block must be at the very bottom, away from the services
volumes:
  redpanda-data: