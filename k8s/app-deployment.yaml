apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
spec:
  replicas: 1 # Starts with a baseline of 1 pod
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80